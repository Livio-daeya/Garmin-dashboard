name: Dashboard bijwerken

# Waarom dit bestaat: het ophalen bij Garmin gebeurde op een Mac, en die staat
# 's avonds dicht. Hier draait het bij GitHub, dus een paar minuten na je
# training staat de nieuwe data online -- zonder dat je iets hoeft aan te zetten.
#
# Wanneer hij draait:
#   * elke 20 minuten in het avondvenster, dus rond en na je trainingen
#   * elke ochtend, zodat je slaap en HRV van die nacht erbij komen
#   * en zodra jij op de verversknop in het dashboard tikt (workflow_dispatch)
#   * en zodra er nieuwe code naar GitHub gaat, zodat een wijziging meteen
#     zichtbaar wordt zonder dat je zelf een bouw hoeft te starten
#
# De tijden staan in UTC; dat schrijft GitHub voor. In de zomer is dat twee uur
# eerder dan de klok in Nederland, in de winter een uur.

on:
  schedule:
    # 19:00-21:40 UTC = 21:00-23:40 zomertijd, 20:00-22:40 wintertijd
    - cron: "*/20 19-21 * * *"
    # 05:10 UTC = 07:10 zomertijd, 06:10 wintertijd
    - cron: "10 5 * * *"
  workflow_dispatch:
  # Duw je nieuwe code naar GitHub, dan bouwt hij meteen een keer. Zonder dit
  # moest je daarna zelf op 'Run workflow' klikken. index.html staat erbuiten:
  # dat bestand schrijft de bouw zelf, en dat hoeft niet nog een bouw te
  # starten. (GitHub start sowieso niets van een duw met de eigen
  # GITHUB_TOKEN, dus een lus kan hier niet ontstaan.)
  push:
    paths-ignore:
      - "index.html"

# Twee tegelijk zou de cache door elkaar husselen en het tokenbestand kunnen
# verminken. Eén tegelijk, en een wachtende run mag vervallen: een verse run
# doet toch hetzelfde werk.
concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakketten installeren
        run: pip install --quiet --upgrade garminconnect cryptography

      - name: Ophalen en bouwen
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DASHBOARD_PW:  ${{ secrets.DASHBOARD_PW }}
          MOTOR_GIST:    ${{ secrets.MOTOR_GIST }}
          GH_PAT:        ${{ secrets.GH_PAT }}
          SYNC_GIST:     ${{ secrets.SYNC_GIST }}
          SYNC_TOKEN:    ${{ secrets.SYNC_TOKEN }}
          WEKEN:         ${{ vars.WEKEN || 12 }}
        run: python cloud/bouw.py

      - name: Sporen wissen
        # De tokens en de cache horen niet in de repository terecht te komen.
        # Dit staat ook in .gitignore, maar een tweede slot kost niets.
        if: always()
        run: rm -rf garmin_tokens garmin_cache.json sync.json

      - name: Publiceren
        run: |
          if git diff --quiet -- index.html; then
            echo "Geen nieuwe data; niets te publiceren."
            exit 0
          fi
          git config user.name  "Sportdashboard"
          git config user.email "dashboard@users.noreply.github.com"
          git add index.html .nojekyll
          git commit -m "dashboard bijgewerkt $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
